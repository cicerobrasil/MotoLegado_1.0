<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>MotoLegado - Plataforma SaaS para Motociclistas & Moto Clubes</title>
    <meta name="description" content="Plataforma completa para motociclistas, motoclubes e rotas estradeiras com gamificação e painel de comando." />
    <meta property="og:title" content="MotoLegado" />
    <meta property="og:description" content="Plataforma completa para motociclistas, motoclubes e rotas estradeiras com gamificação e painel de comando." />

    <!-- Intercept harmless Vite WebSocket closures in container preview -->
    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var r = event && (event.reason || event.message);
          var msg = typeof r === 'object' ? (r && (r.message || r.stack) || '') : String(r || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
