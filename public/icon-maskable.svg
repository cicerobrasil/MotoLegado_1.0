<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orangeGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7828" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="shieldBorderMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="#090d16" />

  <!-- Safe zone scaled content (80% scaled and centered at (256, 256)) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Tech ring -->
    <circle cx="256" cy="256" r="224" fill="none" stroke="#ea580c" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="12 8" />
    
    <!-- Outer Shield Crest -->
    <path d="M 256 64 L 400 128 C 400 280 256 392 256 424 C 256 392 112 280 112 128 Z" 
          fill="#0d1424" stroke="url(#shieldBorderMask)" stroke-width="8" stroke-linejoin="round" />

    <!-- Inner Shield Glow -->
    <path d="M 256 86 L 380 142 C 380 268 256 364 256 392 C 256 364 132 268 132 142 Z" 
          fill="#090d16" stroke="#ea580c" stroke-width="2" stroke-opacity="0.5" />

    <!-- Stylized Biker Wings -->
    <g fill="url(#orangeGradMask)" opacity="0.95">
      <path d="M 230 190 L 140 180 C 170 205 210 215 230 218 Z" />
      <path d="M 226 226 L 152 230 C 180 248 214 252 226 254 Z" />
      <path d="M 224 262 L 168 274 C 190 286 216 288 224 288 Z" />

      <path d="M 282 190 L 372 180 C 342 205 302 215 282 218 Z" />
      <path d="M 286 226 L 360 230 C 332 248 298 252 286 254 Z" />
      <path d="M 288 262 L 344 274 C 322 286 296 288 288 288 Z" />
    </g>

    <!-- Central Motorcycle Headlight / Piston Cog -->
    <circle cx="256" cy="236" r="48" fill="#1e293b" stroke="#ea580c" stroke-width="6" filter="url(#glowMask)" />
    <circle cx="256" cy="236" r="36" fill="#090d16" stroke="#fb923c" stroke-width="3" />
    <circle cx="256" cy="236" r="18" fill="url(#orangeGradMask)" />

    <!-- Compass Star / Speedometer needle -->
    <polygon points="256,196 261,232 256,228 251,232" fill="#ffffff" />
    <polygon points="256,276 261,240 256,244 251,240" fill="#f97316" />

    <!-- Speedometer tick marks -->
    <line x1="230" y1="218" x2="222" y2="212" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    <line x1="282" y1="218" x2="290" y2="212" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="202" x2="256" y2="194" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Lower Banner Typography: MOTO LEGADO -->
    <path d="M 180 340 L 332 340 L 320 372 L 256 384 L 192 372 Z" fill="#ea580c" />
    <text x="256" y="362" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" letter-spacing="3">MOTOLEGADO</text>
  </g>
</svg>
