<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 100" width="100%" height="100%">
  <!-- Fundo Azul Escuro Oficial (#001b3d) -->
  <rect width="504" height="100" rx="12" fill="#001b3d" />

  <!-- Caixa Salmão Oficial (#ff751f) -->
  <rect x="12" y="12" width="76" height="76" rx="11" fill="#ff751f" />

  <!-- Letra M em Azul (#001b3d) -->
  <text
    x="50"
    y="70"
    font-family="Outfit, Montserrat, system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="62"
    fill="#001b3d"
    text-anchor="middle"
  >M</text>

  <!-- OTO (Branco #ffffff) + LEGADO (Salmão #ff751f) -->
  <text
    x="100"
    y="70"
    font-family="Outfit, Montserrat, system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="62"
    letter-spacing="-0.5px"
  >
    <tspan fill="#ffffff">OTO</tspan><tspan fill="#ff751f">LEGADO</tspan>
  </text>
</svg>
